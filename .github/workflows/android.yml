
name: NightLink Android APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Android project
        run: |
          flutter create \
            --project-name nightlink \
            --org com.nightlink \
            "$RUNNER_TEMP/nightlink"
          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path(os.environ["RUNNER_TEMP"]) / "nightlink/android/app/src/main/AndroidManifest.xml"
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          for permission in permissions:
              permission_name = permission.split('name="')[1].split('"')[0]
              if permission_name not in text:
                  text = text.replace('<application', permission + '\\n    <application', 1)
          manifest.write_text(text)
          PY

      - name: Add NightLink app code
        run: |
          cp -R lib/. "$RUNNER_TEMP/nightlink/lib/"

      - name: Install Supabase dependency
        working-directory: ${{ runner.temp }}/nightlink
        run: |
          flutter pub add supabase_flutter livekit_client:^2.13.2
          flutter pub get

      - name: Build Android APK
        working-directory: ${{ runner.temp }}/nightlink
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo 'SUPABASE_PUBLISHABLE_KEY secret is missing' >&2; exit 1)
          build_args=(flutter build apk --release)
          if [ -n "$SUPABASE_URL" ]; then
            build_args+=(--dart-define=SUPABASE_URL="$SUPABASE_URL")
          fi
          build_args+=(--dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY")
          "${build_args[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightLink-Android-APK
          path: ${{ runner.temp }}/nightlink/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

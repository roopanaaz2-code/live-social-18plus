name: NightLink Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightlink-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed NightLink APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/.nightlink-build"
          flutter create --project-name nightlink --org com.nightlink "$BUILD_DIR"
          cp -R lib/. "$BUILD_DIR/lib/"

          python3 - "$BUILD_DIR/android/app/src/main/AndroidManifest.xml" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          content = manifest.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CHANGE_NETWORK_STATE",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          tags = [f'    <uses-permission android:name="{name}" />'
                  for name in permissions if name not in content]
          if tags:
              content = content.replace(
                  "<application",
                  "\n".join(tags) + "\n    <application",
                  1,
              )
          manifest.write_text(content)
          PY

          # Match all Android plugin Java/Kotlin targets at 17.
          # Do not set JavaCompile.options.release: Android plugins need
          # the Android SDK boot classpath (android.jar).
          cat >> "$BUILD_DIR/android/build.gradle.kts" <<'KOTLIN'

          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType<JavaCompile>().configureEach {
                      sourceCompatibility = JavaVersion.VERSION_17.toString()
                      targetCompatibility = JavaVersion.VERSION_17.toString()
                  }
                  tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                      compilerOptions {
                          jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                      }
                  }
              }
          }
          KOTLIN

          chmod +x "$BUILD_DIR/android/gradlew"

      - name: Resolve Flutter dependencies
        working-directory: .nightlink-build
        shell: bash
        run: |
          set -euo pipefail
          flutter pub add supabase_flutter livekit_client:^2.13.2 url_launcher image_picker video_player just_audio file_picker share_plus:^10.1.4
          flutter pub get

      - name: Configure optional release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done

          if [[ "$present" -eq 0 ]]; then
            echo "Signing secrets are not configured; using Flutter's debug-keystore fallback for this test APK."
          elif [[ "$present" -ne 4 ]]; then
            echo "All four signing secrets are required together: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD." >&2
            exit 1
          else
            KEYSTORE_PATH="$RUNNER_TEMP/nightlink-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            cat >> "$GITHUB_WORKSPACE/.nightlink-build/android/app/build.gradle.kts" <<'KOTLIN'

            android {
                signingConfigs {
                    create("nightlinkRelease") {
                        storeFile = file(System.getenv("KEYSTORE_PATH")!!)
                        storePassword = System.getenv("KEYSTORE_PASSWORD")
                        keyAlias = System.getenv("KEY_ALIAS")
                        keyPassword = System.getenv("KEY_PASSWORD")
                    }
                }
                buildTypes {
                    getByName("release") {
                        signingConfig = signingConfigs.getByName("nightlinkRelease")
                    }
                }
            }
          KOTLIN
            echo "Release keystore decoded and release signing configured."
          fi

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: .nightlink-build/android
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://falimxmpicqaakjnigkv.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is missing." >&2; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY secret is missing." >&2; exit 1; }

          DART_DEFINES="$(python3 - <<'PY'
          import base64
          import os
          values = [
              "SUPABASE_URL=" + os.environ["SUPABASE_URL"],
              "SUPABASE_PUBLISHABLE_KEY=" + os.environ["SUPABASE_PUBLISHABLE_KEY"],
          ]
          print(",".join(base64.b64encode(v.encode()).decode() for v in values))
          PY
          )"

          ./gradlew assembleRelease --stacktrace -Pdart-defines="$DART_DEFINES"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=".nightlink-build/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "Release APK was not generated." >&2; exit 1; }
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NightLink-Android-Release-APK
          path: .nightlink-build/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

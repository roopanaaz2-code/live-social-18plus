name: NightLink Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightlink-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed NightLink APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Generate Android host project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$GITHUB_WORKSPACE/.nightlink-build"
          flutter create --project-name nightlink --org com.nightlink "$BUILD_DIR"
          cp -R lib/. "$BUILD_DIR/lib/"

          # 1) Manifest permissions
          python3 - "$BUILD_DIR/android/app/src/main/AndroidManifest.xml" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          c = p.read_text()
          perms = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CHANGE_NETWORK_STATE",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          tags = [f'    <uses-permission android:name="{n}" />' for n in perms if n not in c]
          if tags:
              c = c.replace("<application", "\n".join(tags) + "\n    <application", 1)
          p.write_text(c)
          PY

          # 2) Gradle properties
          cat >> "$BUILD_DIR/android/gradle.properties" <<'EOF'
          kotlin.jvm.target.validation.mode=warning
          android.newDsl=false
          android.builtInKotlin=false
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          EOF

          # 3) Pin AGP / Kotlin / Gradle
          python3 - "$BUILD_DIR/android" <<'PY'
          import re, sys
          from pathlib import Path
          android = Path(sys.argv[1])
          settings = next((p for p in (android/"settings.gradle.kts", android/"settings.gradle") if p.exists()), None)
          if settings:
              t = settings.read_text()
              t, a = re.subn(r"""(id\s*\(?\s*["']com\.android\.application["']\s*\)?\s+version\s+["'])[^"']+(["'])""", r"\g<1>8.10.1\2", t)
              t, k = re.subn(r"""(id\s*\(?\s*["']org\.jetbrains\.kotlin\.android["']\s*\)?\s+version\s+["'])[^"']+(["'])""", r"\g<1>2.1.0\2", t)
              settings.write_text(t)
              print(f"settings patched: AGP={a} Kotlin={k}")
          w = android/"gradle/wrapper/gradle-wrapper.properties"
          lines = w.read_text().splitlines()
          lines = [("distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip"
                    if l.startswith("distributionUrl=") else l) for l in lines]
          w.write_text("\n".join(lines) + "\n")
          PY

      - name: Resolve Flutter dependencies
        working-directory: .nightlink-build
        run: |
          set -euo pipefail
          flutter pub add supabase_flutter livekit_client:^2.13.2 url_launcher image_picker video_player just_audio file_picker share_plus:^10.1.4
          flutter pub get

      - name: Configure optional release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for v in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -n "$v" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "No signing secrets; using debug keystore fallback."
          elif [[ "$present" -ne 4 ]]; then
            echo "All four signing secrets are required together." >&2
            exit 1
          else
            KEYSTORE_PATH="$RUNNER_TEMP/nightlink-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            cat >> "$GITHUB_WORKSPACE/.nightlink-build/android/app/build.gradle.kts" <<'KOTLIN'

          android {
              signingConfigs {
                  create("nightlinkRelease") {
                      storeFile = file(System.getenv("KEYSTORE_PATH")!!)
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("nightlinkRelease")
                  }
              }
          }
          KOTLIN
          fi

      - name: Build release APK
        working-directory: .nightlink-build
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://falimxmpicqaakjnigkv.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY secret is missing." >&2; exit 1; }
          flutter build apk --release -v \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=".nightlink-build/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK" || { echo "Release APK was not generated." >&2; exit 1; }
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NightLink-Android-Release-APK
          path: .nightlink-build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
--- YAML END ---